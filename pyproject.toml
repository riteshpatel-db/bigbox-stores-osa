[project]
name = "bigbox-stores-osa"
version = "0.1.0"
description = "Near-real-time on-shelf availability and reorder recommendations for a big-box retailer (Bigbox Stores, fictional) on Databricks."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pyarrow>=15",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
    "pandas>=2.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src/generator", "src/genie", "src/ml", "src/value"]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks: spark, dbutils and display are provided by the runtime.
"src/ml/*.ipynb" = ["F821"]
"src/lakebase/*.ipynb" = ["F821"]
# Long lines here are SQL statements and markdown table rows; wrapping them hurts readability.
"scripts/evidence_ml.py" = ["E501"]
"scripts/evidence_lakebase.py" = ["E501"]
"scripts/evidence_app.py" = ["E501"]
"scripts/evidence_cost.py" = ["E501"]
"scripts/evidence_index.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["bigbox_gen", "bigbox_lakebase", "bigbox_ml", "cost_model", "value_model"]
